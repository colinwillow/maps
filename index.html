<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>maps</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e8e4da'/%3E%3Cpath d='M6 2 L8 14 M10 2 L8 14' stroke='%239fc4cf' stroke-width='3' fill='none'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      A LINK, AND NOTHING ELSE. The walkable Portland lives in its own repo now
      (colinwillow/portland) because it shares nothing with this app but a
      domain: its own WebGL context, its own vendored three, no build step.
      This is the only thing the map platform knows about it.

      ABSOLUTE, because it is a different origin. It was `./pdx/` while the
      city rode along inside public/ here, and that stopped being true the
      moment it moved.
    -->
    <a id="toPdx" href="https://colinwillow.github.io/portland/"
       target="_blank" rel="noopener">walk Portland &rarr;</a>
    <style>
      #toPdx {
        position: fixed; z-index: 50;
        left: 50%; transform: translateX(-50%);
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        padding: 11px 20px; border-radius: 999px;
        font: 600 15px/1 'Barlow Condensed', system-ui, sans-serif;
        letter-spacing: .04em; text-transform: uppercase; text-decoration: none;
        color: #17211f; background: #e8e4da; border: 2px solid #17211f;
        box-shadow: 0 3px 0 #17211f;
      }
      #toPdx:active { transform: translateX(-50%) translateY(3px); box-shadow: none; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
